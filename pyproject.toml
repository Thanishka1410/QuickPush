[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickpush"
version = "1.0.0"
description = "A powerful CLI tool to automate staging, committing, pushing code to GitHub, and creating PRs with a single command."
readme = "README.md"
authors = [
    { name = "QuickPush Developers", email = "dev@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["git", "github", "cli", "automation", "workflow", "push", "pull-request"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control :: Git",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
gpush = "quickpush.cli:main"
quickpush = "quickpush.cli:main"
